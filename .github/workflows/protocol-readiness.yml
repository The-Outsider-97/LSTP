name: Protocol readiness
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  readiness:
    name: Release / pre-training readiness gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/check_schema_contract.py
      - run: python tools/check_readiness.py
