name: Protocol readiness
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  readiness:
    name: Release / pre-training readiness gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e '.[dev]'
      - run: python tools/run_release_checks.py --final
