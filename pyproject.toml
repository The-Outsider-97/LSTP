[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "lstp"
version = "0.1.0a1"
description = "Lattice Semantic Transport Protocol development and inspection tools"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "LSTP contributors"}]
dependencies = []
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9", "hypothesis>=6,<7", "jsonschema>=4.23,<5",
  "build>=1.2,<2", "ruff>=0.12,<1", "mypy>=1.15,<2",
]

[project.scripts]
lstp = "lstp.cli:main"

[project.urls]
Repository = "https://github.com/The-Outsider-97/LSTP"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lstp = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/lstp"]
